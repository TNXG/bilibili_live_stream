[package]
name = "bili_live"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

[dependencies]
arboard = { version = "3.7.0", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = { version = "0.4.35", features = ["std"] }
qrcode = { version = "0.14.1", default-features = false }
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "blocking",
    "cookies",
    "rustls",
    "form",
    "query",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["alloc"] }
thiserror = { version = "2.0.21", default-features = false }
unicode-width = "0.2"
