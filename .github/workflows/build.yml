name: Build and Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}

jobs:
  check:
    name: Test and prepare matrix
    # Standard hosted runners are free for public repositories only.
    if: github.event.repository.private == false
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Test application
        run: cargo test --locked
      - name: Test release tooling
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Prepare target matrix
        id: matrix
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          targets = json.loads(Path('.github/targets.json').read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('matrix=' + json.dumps({'include': targets}, separators=(',', ':')) + '\n')
      - name: Prepare release draft
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$BUILD_VERSION" --json isDraft --jq .isDraft > is-draft.txt; then
            if [[ "$(cat is-draft.txt)" != true ]]; then
              echo 'Refusing to replace an already published release.' >&2
              exit 1
            fi
          else
            gh release create "$BUILD_VERSION" --verify-tag --draft --title "$BUILD_VERSION" --notes 'Building and verifying distribution packages.'
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        # Pin the CLI; current images supply modern GCC, CMake and QEMU.
        run: cargo install cross --git https://github.com/cross-rs/cross --rev a9301e91f72bba3850460512685f6b16062015ff --locked
      - name: Select cross image
        if: matrix.cross
        run: |
          image_key="CROSS_TARGET_${TARGET^^}_IMAGE"
          image_key="${image_key//-/_}"
          echo "${image_key}=ghcr.io/cross-rs/${TARGET}:main" >> "$GITHUB_ENV"
      - name: Build with cross
        if: matrix.cross
        run: cross build --release --locked --target "$TARGET" --bin bili_live
      - name: Build natively
        if: '!matrix.cross'
        run: cargo build --release --locked --target "$TARGET" --bin bili_live
      - name: Verify native binary
        if: matrix.smoke == 'native'
        run: |
          executable="target/$TARGET/release/bili_live"
          if [[ "$TARGET" == *windows* ]]; then executable+=".exe"; fi
          "$executable" --version
          "$executable" --help
      - name: Verify binary in cross runner
        if: matrix.smoke == 'qemu'
        run: |
          cross run --release --locked --target "$TARGET" --bin bili_live -- --version
          cross run --release --locked --target "$TARGET" --bin bili_live -- --help
      - name: Package distribution
        run: python .github/scripts/release.py package --target "$TARGET" --version "$BUILD_VERSION"
      - name: Summarize target
        env:
          VERIFICATION: ${{ matrix.smoke }}
        run: |
          {
            echo "### $TARGET"
            echo "- Startup verification: $VERIFICATION"
            echo "- Toolchain: $(rustc --version)"
            echo "- Archive:"
            printf '  - `%s`\n' artifacts/*
          } >> "$GITHUB_STEP_SUMMARY"
      # Release assets avoid metered Actions artifact/cache storage entirely.
      - name: Upload verified package to draft
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$BUILD_VERSION" artifacts/* --clobber

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download verified packages
        run: gh release download "$BUILD_VERSION" --pattern '*.zip' --pattern '*.tar.gz' --dir artifacts
      - name: Generate checksums and release notes
        run: |
          python .github/scripts/release.py notes --tag "$BUILD_VERSION" --repository "$GITHUB_REPOSITORY"
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish complete release
        run: |
          gh release upload "$BUILD_VERSION" artifacts/SHA256SUMS --clobber
          if [[ "${BUILD_VERSION%%+*}" == *-* ]]; then
            gh release edit "$BUILD_VERSION" --draft=false --prerelease --latest=false --notes-file release-notes.md
          else
            gh release edit "$BUILD_VERSION" --draft=false --prerelease=false --latest --notes-file release-notes.md
          fi
